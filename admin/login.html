<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#B8EF72">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="about recruit">
  <link rel="apple-touch-icon" href="/assets/icons/about-icon-192.png">
  <title>about recruit</title>
  <script>
    const params = new URLSearchParams(window.location.search);
    let from = params.get('from') || 'admin/index.html';
    if (!from.includes('://') && !from.startsWith('//') && !from.startsWith('admin/')) {
      from = `admin/${from.replace(/^\.?\//, '')}`;
    }
    window.location.replace(`../login.html?role=staff&from=${encodeURIComponent(from)}`);
  </script>
</head>
