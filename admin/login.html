<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 | about编辑部 Open Call</title>
  <script>
    const params = new URLSearchParams(window.location.search);
    let from = params.get('from') || 'admin/index.html';
    if (!from.includes('://') && !from.startsWith('//') && !from.startsWith('admin/')) {
      from = `admin/${from.replace(/^\.?\//, '')}`;
    }
    window.location.replace(`../login.html?role=staff&from=${encodeURIComponent(from)}`);
  </script>
</head>
<body>
  <p>正在前往登录入口……</p>
</body>
</html>
