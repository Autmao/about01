<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#B8EF72">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="about recruit">
  <link rel="apple-touch-icon" href="/assets/icons/about-icon-192.png">
  <title>投递申请 | about编辑部</title>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/home-v2.css">
  <link rel="stylesheet" href="assets/css/components.css">
</head>
<body class="home-v2 apply-page page-enter">

  <nav class="home-nav" aria-label="主导航">
    <a class="home-nav__brand" href="index.html">about编辑部</a>
    <a class="home-nav__cta" href="index.html">返回首页</a>
  </nav>

  <main class="container apply-shell">

    <nav class="breadcrumb">
      <a href="#" id="bc-job" onclick="history.back();return false;">项目详情</a>
      <span class="breadcrumb__sep">/</span>
      <span class="breadcrumb__current">投递申请</span>
    </nav>

    <!-- 岗位摘要 -->
    <div class="job-summary-card" id="job-summary"></div>

    <!-- 表单区域 -->
    <form id="apply-form" novalidate>

      <div class="form-section">
        <h2 class="form-section__title">基本信息</h2>
        <div class="form-row">
          <div class="form-field">
            <label class="form-label">姓名 <span class="form-required">*</span></label>
            <input type="text" class="form-input" id="field-name" name="name" placeholder="你的真实姓名">
            <span class="form-error" id="err-name"></span>
          </div>
          <div class="form-field">
            <label class="form-label">联系邮箱 <span class="form-required">*</span></label>
            <input type="email" class="form-input" id="field-email" name="email" placeholder="用于接收状态通知">
            <span class="form-error" id="err-email"></span>
          </div>
        </div>
        <div class="form-row">
          <div class="form-field">
            <label class="form-label">手机号 <span class="form-required">*</span></label>
            <input type="tel" class="form-input" id="field-phone" name="phone" placeholder="11位手机号">
            <span class="form-error" id="err-phone"></span>
          </div>
          <div class="form-field">
            <label class="form-label">微信号 <span class="form-required">*</span></label>
            <input type="text" class="form-input" id="field-wechat" name="wechat" placeholder="方便快速沟通">
            <span class="form-error" id="err-wechat"></span>
          </div>
        </div>
      </div>

      <div class="form-section">
        <h2 class="form-section__title">自我介绍</h2>
        <div class="form-field">
          <label class="form-label">
            个人介绍 <span class="form-required">*</span>
            <span class="char-count" id="bio-count">0/200</span>
          </label>
          <textarea class="form-input" id="field-bio" name="bio" rows="5"
            placeholder="200字内介绍你的背景、代表作品和工作风格。"></textarea>
          <span class="form-error" id="err-bio"></span>
        </div>
      </div>

      <div class="form-section">
        <h2 class="form-section__title">简历 / 作品集</h2>
        <div class="form-field">
          <label class="form-label">上传简历和作品集 <span class="form-required">*</span></label>
          <div class="upload-zone" id="materials-zone">
            <input type="file" id="materials-input" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png,.gif,.webp" style="display:none" multiple>
            <div class="upload-zone__inner" onclick="document.getElementById('materials-input').click()">
              <span class="upload-zone__text">点击上传文件</span>
              <span class="upload-zone__hint">可上传多个文件，所有文件合计不超过50MB</span>
            </div>
            <div id="materials-files-preview"></div>
          </div>
          <span class="form-error" id="err-materials"></span>
        </div>
      </div>

      <div class="form-section">
        <h2 class="form-section__title">作品集链接</h2>
        <div class="form-field">
          <label class="form-label">作品集链接 <span class="form-optional">选填，最多3个</span></label>
          <div id="portfolio-links-container"></div>
          <button type="button" class="btn btn--ghost btn--sm" id="add-link-btn" style="margin-top: var(--space-2);">+ 添加链接</button>
          <span class="form-hint">可以是个人网站、网盘分享、公众号等任何链接</span>
        </div>
      </div>

      <div style="font-size: var(--text-xs); color: var(--color-text-muted); margin-bottom: var(--space-6); line-height: var(--leading-loose);">
        提交即代表你同意我们将你的信息用于本次合作筛选，上述所有信息我们不会向第三方披露。
      </div>

      <div class="form-actions" style="border-top:none; padding-top:0;">
        <button type="button" class="btn btn--ghost" onclick="history.back()">返回</button>
        <button type="submit" class="btn btn--primary btn--lg" id="submit-btn">提交投递</button>
      </div>
    </form>

    <!-- 成功状态 -->
    <div class="success-state" id="success-state">
      <span class="success-icon">🎉</span>
      <h2 class="success-title">投递成功！</h2>
      <p class="success-desc">我们已收到你的申请，通常在 3 个工作日内回复。</p>
      <p class="success-desc">后续可用邮箱查询状态；重要结果也会发送至：<strong id="success-email"></strong></p>
      <div class="success-id" id="success-id"></div>
      <a href="index.html" class="btn btn--primary">返回首页，查看其他创作项目</a>
    </div>

  </main>

  <script src="assets/js/store.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/pages/apply.js"></script>
<script src="/assets/js/pages/chat-widget.js"></script>
<script src="/assets/js/pwa-register.js"></script>
</body>
</html>
