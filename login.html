<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#B8EF72">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="about招募">
  <link rel="apple-touch-icon" href="/assets/icons/about-icon-192.png">
  <title>登录 | about编辑部 Open Call</title>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/home-v2.css">
  <style>
    .login-page {
      --login-ink: #111111;
      --login-paper: #f5f1e8;
      --login-soft: #fbf8f1;
      --login-muted: #6f6a60;
      --login-line: rgba(17,17,17,0.18);
      --login-line-strong: rgba(17,17,17,0.82);
      --login-accent: #b84a36;
      min-height: 100vh;
      background:
        linear-gradient(90deg, rgba(17,17,17,0.035) 1px, transparent 1px),
        linear-gradient(180deg, rgba(17,17,17,0.035) 1px, transparent 1px),
        var(--login-paper);
      background-size: 56px 56px;
      color: var(--login-ink);
      overflow-x: hidden;
    }
      .login-shell {
        min-height: 100vh;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        padding: 108px clamp(18px, 5vw, 76px) 64px;
        display: grid;
        grid-template-columns: minmax(0, 0.78fr) minmax(0, 1.22fr);
        gap: clamp(32px, 6vw, 92px);
        align-items: start;
      }
    .login-intro {
      max-width: 620px;
      min-width: 0;
    }
    .login-kicker {
      color: var(--login-accent);
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 760;
      margin-bottom: 18px;
    }
    .login-intro h1 {
      margin: 0;
      font-size: clamp(48px, 6.1vw, 86px);
      line-height: 0.94;
      letter-spacing: 0;
      font-weight: 720;
    }
    .login-intro h1 span {
      display: block;
      white-space: nowrap;
    }
    .login-intro p {
      color: var(--login-muted);
      font-size: 17px;
      line-height: 1.75;
      margin-top: 28px;
      overflow-wrap: anywhere;
    }
    .login-page[data-role="choice"] #login-desc {
      display: none;
    }
    .login-panels {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }
    .login-choice {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      min-width: 0;
    }
    .login-choice-card {
      min-height: 236px;
      border: 1px solid var(--login-line-strong);
      background: rgba(251,248,241,0.78);
      color: var(--login-ink);
      padding: clamp(22px, 4vw, 34px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 24px 70px rgba(0,0,0,0.08);
      transition: transform 180ms ease, background 180ms ease, box-shadow 180ms ease;
      min-width: 0;
    }
    .login-choice-card:hover {
      transform: translateY(-4px);
      background: #fffdf7;
      box-shadow: 0 30px 84px rgba(0,0,0,0.13);
    }
    .login-choice-card__label {
      color: var(--login-muted);
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .login-choice-card strong {
      display: block;
      margin-top: auto;
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1.05;
      font-weight: 720;
    }
    .login-choice-card small {
      display: block;
      margin-top: 12px;
      color: var(--login-muted);
      font-size: 14px;
      line-height: 1.65;
    }
    .login-page[data-role="choice"] .login-panels,
    .login-page:not([data-role]) .login-panels {
      display: none;
    }
    .login-page[data-role="applicant"] .login-choice,
    .login-page[data-role="staff"] .login-choice {
      display: none;
    }
    .login-page[data-role="applicant"] .login-panels,
    .login-page[data-role="staff"] .login-panels {
      grid-template-columns: minmax(0, 620px);
    }
    .login-page[data-role="applicant"] #staff-panel,
    .login-page[data-role="staff"] #applicant-panel {
      display: none;
    }
    .login-panel {
      border: 1px solid var(--login-line-strong);
      background: rgba(251,248,241,0.82);
      padding: clamp(22px, 4vw, 34px);
      box-shadow: 0 24px 70px rgba(0,0,0,0.08);
      min-width: 0;
    }
    .login-panel.is-active {
      background: #fffdf7;
      box-shadow: 0 28px 82px rgba(0,0,0,0.12);
    }
    .login-panel__label {
      color: var(--login-muted);
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 22px;
    }
    .login-panel h2 {
      margin: 0 0 10px;
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1;
      font-weight: 700;
    }
    .login-panel p {
      margin: 0 0 26px;
      color: var(--login-muted);
      font-size: 14px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }
    .login-panel .form-label {
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-size: 12px;
      color: var(--login-muted);
    }
    .login-panel .form-input {
      border-radius: 0;
      border-color: var(--login-line-strong);
      background: transparent;
      min-height: 48px;
    }
    .login-panel .btn {
      border-radius: 999px;
    }
    .login-panel .btn--primary {
      background: var(--login-ink);
      color: var(--login-soft);
    }
    .login-panel .btn--primary:hover {
      background: #3a3a38;
    }
    .login-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .login-error,
    .login-note {
      min-height: 18px;
      margin-top: 12px;
      font-size: var(--text-xs);
      color: var(--color-rejected);
    }
    .login-note {
      color: var(--login-muted);
    }
    .login-switch {
      margin-top: 18px;
      display: inline-flex;
      align-items: center;
      color: var(--login-muted);
      font-size: 13px;
      text-decoration: underline;
      text-underline-offset: 4px;
    }
    .login-switch:hover {
      color: var(--login-ink);
    }
    @media (max-width: 960px) {
      .login-shell,
      .login-panels,
      .login-choice {
        grid-template-columns: minmax(0, 1fr);
      }
      .login-shell {
        align-items: start;
      }
    }
    @media (max-width: 560px) {
      .login-shell {
        min-height: auto;
        padding: 92px 20px 48px;
        gap: 28px;
      }
      .login-page .home-nav__links {
        display: none;
      }
      .login-page .home-nav {
        right: auto;
        width: calc(100vw - 24px);
      }
      .login-intro,
      .login-choice,
      .login-panels {
        width: calc(100vw - 40px);
        max-width: calc(100vw - 40px);
      }
      .login-choice-card,
      .login-panel {
        width: 100%;
      }
      .login-kicker {
        font-size: 12px;
        margin-bottom: 14px;
      }
      .login-intro h1 {
        max-width: 340px;
        font-size: clamp(38px, 11vw, 48px);
        line-height: 1.04;
      }
      .login-intro p {
        font-size: 15px;
        line-height: 1.68;
        margin-top: 20px;
      }
      .login-choice-card {
        min-height: 156px;
        padding: 22px 20px;
      }
      .login-panel {
        padding: 22px 20px;
      }
    }
  </style>
</head>
<body class="home-v2 login-page">
  <script>
    (function () {
      const role = new URLSearchParams(window.location.search).get('role');
      document.body.dataset.role = role === 'staff' || role === 'applicant' ? role : 'choice';
    })();
  </script>
  <nav class="home-nav" aria-label="主导航">
    <a class="home-nav__brand" href="index.html">about编辑部</a>
    <div class="home-nav__links">
      <a href="index.html#open-calls">正在招募</a>
      <a href="my-applications.html">查询状态</a>
    </div>
    <a class="home-nav__cta" href="index.html">返回首页</a>
  </nav>

  <main class="login-shell">
    <section class="login-intro">
      <div class="login-kicker">Open Call Login</div>
      <h1 id="login-title"><span>选择你的</span><span>登录入口。</span></h1>
      <p id="login-desc"></p>
    </section>

    <section class="login-choice" aria-label="选择登录身份">
      <a class="login-choice-card" href="login.html?role=applicant" data-role-option="applicant">
        <span class="login-choice-card__label">Creative Partner</span>
        <span>
          <strong>我是创作伙伴</strong>
          <small>想要投递岗位、查询进度。</small>
        </span>
      </a>
      <a class="login-choice-card" href="login.html?role=staff" data-role-option="staff">
        <span class="login-choice-card__label">Staff</span>
        <span>
          <strong>我是工作人员</strong>
          <small>进入Open Call工作台。</small>
        </span>
      </a>
    </section>

    <section class="login-panels" aria-label="登录入口">
      <div class="login-panel" id="applicant-panel">
        <div class="login-panel__label">Creative Partner</div>
        <h2>创作伙伴</h2>
        <p>首次使用的创作伙伴可直接输入邮箱获取验证码，验证后将自动创建账号。投递岗位时也会默认使用此邮箱接收状态通知。</p>
        <form id="applicant-form" novalidate>
          <div class="form-field">
            <label class="form-label">邮箱</label>
            <input type="email" class="form-input" id="applicant-email" placeholder="name@example.com" autocomplete="email">
          </div>
          <div class="login-actions">
            <button type="button" class="btn btn--ghost" id="send-code-btn">发送验证码</button>
          </div>
          <div class="form-field" style="margin-top:16px;">
            <label class="form-label">验证码</label>
            <input type="text" class="form-input" id="applicant-code" placeholder="6位验证码" inputmode="numeric" autocomplete="one-time-code">
          </div>
          <button type="submit" class="btn btn--primary btn--full" id="applicant-login-btn">登录并继续</button>
          <div class="login-error" id="applicant-error"></div>
          <div class="login-note" id="applicant-note"></div>
        </form>
        <a class="login-switch" href="login.html" data-reset-role>重新选择身份</a>
      </div>

      <div class="login-panel" id="staff-panel">
        <div class="login-panel__label">Staff</div>
        <h2>工作人员</h2>
        <p>使用工作台账号登录，管理岗位、投递、咨询记录与协作账号。</p>
        <form id="staff-form" novalidate>
          <div class="form-field">
            <label class="form-label">登录账号</label>
            <input type="tel" class="form-input" id="staff-username" placeholder="手机号码" autocomplete="username">
          </div>
          <div class="form-field">
            <label class="form-label">密码</label>
            <input type="password" class="form-input" id="staff-password" autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn--primary btn--full" id="staff-login-btn">进入工作台</button>
          <div class="login-error" id="staff-error"></div>
        </form>
        <a class="login-switch" href="login.html" data-reset-role>重新选择身份</a>
      </div>
    </section>
  </main>

  <script src="assets/js/store.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const from = params.get('from') || '';
    const requestedRole = params.get('role');
    const selectedRole = requestedRole === 'staff' || requestedRole === 'applicant' ? requestedRole : 'choice';
    const titleEl = document.getElementById('login-title');
    const descEl = document.getElementById('login-desc');

    function roleUrl(role) {
      const next = new URLSearchParams({ role });
      if (from) next.set('from', from);
      return `login.html?${next.toString()}`;
    }

    function safeRedirect(defaultPath, allowAdmin) {
      if (!from || from.includes('://') || from.startsWith('//')) return defaultPath;
      if (!allowAdmin && from.startsWith('admin/')) return defaultPath;
      if (allowAdmin && !from.startsWith('admin/')) return defaultPath;
      return from;
    }

    function validEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    const OTP_COUNTDOWN_SECONDS = 60;
    let otpCountdownTimer = null;

    function resetOtpButton(label = '重新发送') {
      const btn = document.getElementById('send-code-btn');
      btn.disabled = false;
      btn.textContent = label;
    }

    function startOtpCountdown() {
      const btn = document.getElementById('send-code-btn');
      let remaining = OTP_COUNTDOWN_SECONDS;

      if (otpCountdownTimer) {
        clearInterval(otpCountdownTimer);
      }

      const tick = () => {
        if (remaining <= 0) {
          clearInterval(otpCountdownTimer);
          otpCountdownTimer = null;
          resetOtpButton();
          return;
        }

        btn.disabled = true;
        btn.textContent = `${remaining}秒后重新发送`;
        remaining -= 1;
      };

      tick();
      otpCountdownTimer = setInterval(tick, 1000);
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.body.dataset.role = selectedRole;
      document.querySelectorAll('[data-role-option]').forEach(link => {
        link.href = roleUrl(link.dataset.roleOption);
      });
      document.querySelectorAll('[data-reset-role]').forEach(link => {
        link.href = from ? `login.html?from=${encodeURIComponent(from)}` : 'login.html';
      });
      if (selectedRole === 'applicant') {
        titleEl.innerHTML = '<span>创作伙伴</span><span>登录。</span>';
        descEl.textContent = '想要投递岗位、查询进度。';
      } else if (selectedRole === 'staff') {
        titleEl.innerHTML = '<span>工作人员</span><span>登录。</span>';
        descEl.textContent = '进入Open Call工作台。';
      }
      window.scrollTo(0, 0);
      requestAnimationFrame(() => window.scrollTo(0, 0));
      if (selectedRole === 'staff' || selectedRole === 'applicant') {
        document.getElementById(`${selectedRole}-panel`)?.classList.add('is-active');
      }
      const currentEmail = Store.getApplicantEmail();
      if (currentEmail) {
        document.getElementById('applicant-email').value = currentEmail;
        document.getElementById('applicant-note').textContent = `当前已登录：${currentEmail}`;
      }
    });

    document.getElementById('send-code-btn').addEventListener('click', async () => {
      if (otpCountdownTimer) return;
      const email = document.getElementById('applicant-email').value.trim().toLowerCase();
      const err = document.getElementById('applicant-error');
      const note = document.getElementById('applicant-note');
      const btn = document.getElementById('send-code-btn');
      err.textContent = '';
      note.textContent = '';
      if (!validEmail(email)) {
        err.textContent = '请输入有效的邮箱地址';
        return;
      }
      btn.disabled = true;
      btn.textContent = '发送中......';
      try {
        await Store.sendOtp(email);
        note.textContent = '验证码已发送，请查看邮箱';
        document.getElementById('applicant-code').focus();
        startOtpCountdown();
      } catch (e) {
        err.textContent = e.message || '验证码发送失败，请稍后重试';
        resetOtpButton('发送验证码');
      }
    });

    document.getElementById('applicant-form').addEventListener('submit', async e => {
      e.preventDefault();
      const email = document.getElementById('applicant-email').value.trim().toLowerCase();
      const code = document.getElementById('applicant-code').value.trim();
      const err = document.getElementById('applicant-error');
      const btn = document.getElementById('applicant-login-btn');
      err.textContent = '';
      if (!validEmail(email)) {
        err.textContent = '请输入有效的邮箱地址';
        return;
      }
      if (!code) {
        err.textContent = '请输入验证码';
        return;
      }
      btn.disabled = true;
      btn.textContent = '登录中......';
      try {
        await Store.verifyOtp(email, code);
        window.location.href = safeRedirect('my-applications.html', false);
      } catch (e) {
        err.textContent = e.message || '验证码错误或已过期';
      } finally {
        btn.disabled = false;
        btn.textContent = '登录并继续';
      }
    });

    document.getElementById('staff-form').addEventListener('submit', async e => {
      e.preventDefault();
      const username = document.getElementById('staff-username').value.trim();
      const password = document.getElementById('staff-password').value;
      const err = document.getElementById('staff-error');
      const btn = document.getElementById('staff-login-btn');
      err.textContent = '';
      if (!username || !password) {
        err.textContent = '请输入登录账号和密码';
        return;
      }
      btn.disabled = true;
      btn.textContent = '登录中......';
      try {
        await Store.adminLogin(username, password);
        window.location.href = safeRedirect('admin/index.html', true);
      } catch {
        err.textContent = '用户名或密码错误';
      } finally {
        btn.disabled = false;
        btn.textContent = '进入工作台';
      }
    });
  </script>
<script src="/assets/js/pwa-register.js"></script>
</body>
</html>
