<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#B8EF72">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="about recruit">
  <link rel="apple-touch-icon" href="/assets/icons/about-icon-192.png">
  <title>我的投递 | about编辑部</title>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/home-v2.css">
  <style>
    .query-page {
      --home-ink: #111111;
      --home-coal: #1f2021;
      --home-coal-2: #161718;
      --home-paper: #f5f1e8;
      --home-paper-soft: #fbf8f1;
      --home-warm: #ded4c2;
      --home-line: rgba(17, 17, 17, 0.18);
      --home-line-strong: rgba(17, 17, 17, 0.82);
      --home-muted: #6f6a60;
      --home-accent: #b84a36;
      min-height: 100vh;
      background:
        linear-gradient(90deg, rgba(17,17,17,0.035) 1px, transparent 1px),
        linear-gradient(180deg, rgba(17,17,17,0.035) 1px, transparent 1px),
        var(--home-paper);
      background-size: 56px 56px;
      color: var(--home-ink);
    }
    .query-wrap {
      min-height: 100vh;
      padding: 108px clamp(18px, 5vw, 76px) 64px;
      display: grid;
      grid-template-columns: minmax(0, 0.9fr) minmax(360px, 1.1fr);
      gap: clamp(30px, 6vw, 92px);
      align-items: center;
    }
    .query-intro {
      max-width: 680px;
    }
    .query-kicker {
      color: var(--home-accent);
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 760;
      margin-bottom: 18px;
    }
    .query-intro h1 {
      margin: 0;
      font-size: clamp(48px, 8vw, 104px);
      line-height: 0.92;
      letter-spacing: 0;
      font-weight: 720;
    }
    .query-intro p {
      margin: 28px 0 0;
      max-width: 560px;
      color: var(--home-muted);
      font-size: clamp(17px, 2vw, 21px);
      line-height: 1.72;
    }
    .query-card {
      border: 1px solid var(--home-line-strong);
      background: var(--home-paper-soft);
      padding: clamp(24px, 4vw, 38px);
      box-shadow: 0 26px 70px rgba(0,0,0,0.09);
    }
    .query-card__caption {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      color: var(--home-muted);
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 34px;
    }
    .query-card h2 {
      margin: 0 0 10px;
      font-size: clamp(28px, 4vw, 48px);
      line-height: 1;
      font-weight: 700;
    }
    .query-card__hint {
      color: var(--home-muted);
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 28px;
    }
    .query-form .form-label {
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-size: 12px;
      color: var(--home-muted);
    }
    .query-form .form-input {
      border-radius: 0;
      border-color: var(--home-line-strong);
      background: transparent;
      min-height: 48px;
    }
    .query-form .btn {
      border-radius: 999px;
    }
    .query-page .btn--primary {
      background: var(--home-ink);
      color: var(--home-paper-soft);
    }
    .query-page .btn--primary:hover {
      background: #3a3a38;
    }
    .query-error {
      font-size: var(--text-xs);
      color: var(--color-rejected);
      margin-top: var(--space-2);
      min-height: 18px;
    }
    .apps-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 24px;
    }
    .apps-header h1 {
      margin: 0;
      font-size: clamp(32px, 5vw, 62px);
      line-height: 0.95;
      font-weight: 720;
    }
    .apps-header__info {
      display: block;
      color: var(--home-muted);
      font-size: 13px;
      margin-top: 10px;
    }
    .query-results {
      grid-column: 1 / -1;
      max-width: 980px;
      margin: 0 auto;
      width: 100%;
    }
    .query-app-card {
      border-top: 1px solid var(--home-line-strong);
      padding: 24px 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: start;
    }
    .query-app-card:last-child {
      border-bottom: 1px solid var(--home-line-strong);
    }
    .query-app-card__title {
      font-size: clamp(24px, 3vw, 38px);
      line-height: 1;
      font-weight: 700;
      color: var(--home-ink);
    }
    .query-app-card__meta {
      color: var(--home-muted);
      font-size: 14px;
      margin-top: 9px;
    }
    .query-app-card__actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .query-detail-toggle {
      border: 1px solid var(--home-line);
      background: rgba(251,248,241,0.72);
      color: var(--home-ink);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .query-detail-toggle:hover {
      background: #fffdf8;
      border-color: var(--home-line-strong);
    }
    .query-app-detail {
      grid-column: 1 / -1;
      display: none;
      margin-top: 4px;
      padding: 22px 0 4px;
      border-top: 1px solid var(--home-line);
      color: var(--home-ink);
    }
    .query-app-card.is-open .query-app-detail {
      display: block;
    }
    .query-detail-grid {
      display: grid;
      grid-template-columns: 128px minmax(0, 1fr);
      gap: 14px 24px;
      font-size: 14px;
      line-height: 1.78;
    }
    .query-detail-label {
      color: var(--home-accent);
      font-weight: 720;
    }
    .query-detail-value {
      color: #3d3a34;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .query-detail-links {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }
    .query-detail-link {
      color: var(--home-ink);
      text-decoration: underline;
      text-underline-offset: 3px;
      word-break: break-all;
    }
    .query-detail-empty {
      color: var(--home-muted);
    }
    .app-status-badge {
      flex-shrink: 0;
      font-size: var(--text-xs);
      font-weight: var(--weight-medium);
      padding: 6px 11px;
      border-radius: var(--radius-full);
      border: 1px solid currentColor;
    }
    .app-status-badge--pending  { color: #a56f1f; }
    .app-status-badge--read     { color: #2c5f9f; }
    .app-status-badge--hired    { color: #2c4a3e; }
    .app-status-badge--rejected { color: #a04840; }
    .empty-apps {
      border-top: 1px solid var(--home-line-strong);
      border-bottom: 1px solid var(--home-line-strong);
      padding: 42px 0;
      color: var(--home-muted);
      font-size: var(--text-sm);
    }
    .empty-apps a {
      color: var(--home-ink);
      font-weight: 650;
    }
    @media (max-width: 860px) {
      .query-wrap { grid-template-columns: 1fr; align-items: start; }
      .apps-header { align-items: flex-start; flex-direction: column; }
      .query-app-card { grid-template-columns: 1fr; }
      .query-app-card__actions { justify-content: flex-start; }
      .query-detail-grid { grid-template-columns: 1fr; gap: 6px; }
    }
  </style>
</head>
<body class="query-page page-enter">

  <nav class="home-nav" aria-label="主导航">
    <a class="home-nav__brand" href="index.html">about编辑部</a>
    <div class="home-nav__links">
      <a href="index.html#open-calls">正在招募</a>
    </div>
    <a class="home-nav__cta" href="index.html">返回首页</a>
  </nav>

  <main class="query-wrap">
    <section class="query-intro" id="query-intro">
      <div class="query-kicker">Application Status</div>
      <h1>查询你的投递。</h1>
    </section>

    <section class="query-card" id="query-section">
      <h2>登录后查看记录。</h2>
      <p class="query-card__hint">使用投递邮箱登录后，查看当前记录与处理状态。</p>
      <div class="query-form">
        <button class="btn btn--primary btn--full" id="btn-query" onclick="goApplicantLogin()">创作伙伴登录</button>
      </div>
    </section>

    <section class="query-results" id="apps-section" style="display:none;">
      <div class="apps-header">
        <div>
          <div class="query-kicker">My Applications</div>
          <h1>我的投递。</h1>
          <span class="apps-header__info" id="queried-email"></span>
        </div>
        <div style="display:flex;align-items:center;gap:var(--space-3);">
          <button class="btn btn--ghost btn--sm" onclick="resetQuery()">切换账号</button>
        </div>
      </div>
      <div id="apps-list"></div>
      <div class="empty-apps" id="apps-empty" style="display:none;">
        暂无投递记录，<a href="index.html#open-calls">去看看正在招募的项目</a>
      </div>
    </section>
  </main>

  <script src="assets/js/store.js"></script>
  <script src="assets/js/utils.js"></script>
  <script>
    const STATUS_LABELS = { pending: '审核中', read: '审核中', hired: '已录用', rejected: '未通过' };

    let currentEmail = '';

    function escHtml(s) {
      return String(s ?? '')
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#39;');
    }

    function jsArg(value) {
      return JSON.stringify(String(value ?? '')).replace(/</g, '\\u003C');
    }

    function safeUrl(raw) {
      const value = String(raw || '').trim();
      if (!value) return '#';
      if (value.startsWith('/') && !value.startsWith('//')) return value;
      try {
        const url = new URL(value);
        return ['http:', 'https:'].includes(url.protocol) ? url.href : '#';
      } catch {
        return '#';
      }
    }

    function formatSize(bytes) {
      const n = Number(bytes || 0);
      if (!Number.isFinite(n) || n <= 0) return '';
      if (n < 1024) return `${n}B`;
      if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)}KB`;
      return `${(n / (1024 * 1024)).toFixed(1)}MB`;
    }

    function renderDetailLinks(app) {
      const materialLinks = (app.portfolioFiles || [])
        .map((file, index) => {
          const name = file.name || '未命名材料';
          const size = formatSize(file.size);
          return `<a class="query-detail-link" href="${escHtml(safeUrl(file.url))}" target="_blank" rel="noopener">材料 ${index + 1} · ${escHtml(name)}${size ? ` · ${size}` : ''}</a>`;
        })
        .join('');
      const externalLinks = (app.portfolioLinks || [])
        .map((link, index) => {
          const label = link.label || `作品链接 ${link.index || index + 1}`;
          return `<a class="query-detail-link" href="${escHtml(safeUrl(link.url))}" target="_blank" rel="noopener">链接 ${link.index || index + 1} · ${escHtml(label)}</a>`;
        })
        .join('');
      const allLinks = `${materialLinks}${externalLinks}`;
      return allLinks ? `<div class="query-detail-links">${allLinks}</div>` : '<span class="query-detail-empty">未填写</span>';
    }

    function renderApplicationDetail(app) {
      return `
        <div class="query-detail-grid">
          <div class="query-detail-label">姓名</div>
          <div class="query-detail-value">${escHtml(app.name || '未填写')}</div>
          <div class="query-detail-label">联系方式</div>
          <div class="query-detail-value">
            邮箱：${escHtml(app.email || '未填写')}<br>
            手机：${escHtml(app.phone || '未填写')}<br>
            微信：${escHtml(app.wechat || '未填写')}
          </div>
          <div class="query-detail-label">个人介绍</div>
          <div class="query-detail-value">${escHtml(app.bio || '未填写')}</div>
          <div class="query-detail-label">简历 / 作品集</div>
          <div class="query-detail-value">${renderDetailLinks(app)}</div>
        </div>`;
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (Store.isApplicantLoggedIn()) loadMyApplications();
    });

    function goApplicantLogin() {
      window.location.href = `login.html?role=applicant&from=${encodeURIComponent('my-applications.html')}`;
    }

    async function loadMyApplications() {
      const email = Store.getApplicantEmail() || '';
      try {
        const apps = await Store.getApplicantApplications();
        currentEmail = email;
        document.getElementById('query-intro').style.display = 'none';
        document.getElementById('query-section').style.display = 'none';
        document.getElementById('apps-section').style.display = 'block';
        document.getElementById('queried-email').textContent = email;
        renderApps(apps);
      } catch {
        Store.applicantLogout();
        goApplicantLogin();
      }
    }

    function renderApps(apps) {
      const list = document.getElementById('apps-list');
      const empty = document.getElementById('apps-empty');
      if (!apps.length) { list.innerHTML = ''; empty.style.display = 'block'; return; }
      empty.style.display = 'none';
      list.innerHTML = apps.map(a => {
        const statusClass = `app-status-badge--${a.status}`;
        const statusText = STATUS_LABELS[a.status] || a.status;
        const date = a.submittedAt ? a.submittedAt.slice(0, 10) : '';
        return `
        <article class="query-app-card" id="app-${escHtml(a.id)}">
          <div>
            <div class="query-app-card__title">${escHtml(a.jobTitle || '未知岗位')}</div>
            <div class="query-app-card__meta">投递于 ${date || '—'}</div>
          </div>
          <div class="query-app-card__actions">
            <span class="app-status-badge ${statusClass}">${statusText}</span>
            <button class="query-detail-toggle" type="button" aria-expanded="false" onclick="toggleApplicationDetail(${jsArg(a.id)}, this)">查看投递内容</button>
          </div>
          <div class="query-app-detail">${renderApplicationDetail(a)}</div>
        </article>`;
      }).join('');
    }

    function toggleApplicationDetail(id, button) {
      const card = document.getElementById(`app-${id}`);
      if (!card) return;
      const isOpen = card.classList.toggle('is-open');
      button.setAttribute('aria-expanded', String(isOpen));
      button.textContent = isOpen ? '收起投递内容' : '查看投递内容';
    }

    function resetQuery() {
      Store.applicantLogout();
      goApplicantLogin();
    }
  </script>
<script src="/assets/js/pages/chat-widget.js"></script>
<script src="/assets/js/pwa-register.js"></script>
</body>
</html>
